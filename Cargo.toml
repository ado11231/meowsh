[package]
name = "meowsh"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small cat that lives in your terminal."
readme = "README.md"
keywords = ["terminal", "cat", "pty", "shell"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2"
portable-pty = "0.9.0"
signal-hook = "0.4.4"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "warn"
