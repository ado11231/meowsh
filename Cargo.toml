[package]
name = "meowsh"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small cat that lives in your terminal."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ado11231/meowsh"
# The build only needs the finished frames, not the Blender files or the docs.
exclude = [".github/", "assets/art/", "docs/", "*.blend", "*.blend1"]
keywords = ["terminal", "cat", "pty", "shell"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
fastrand = "2.5.0"
flate2 = "1.1.11"
jiff = "1.0.3"
libc = "0.2"
png = "0.18.1"
portable-pty = "0.9.0"
signal-hook = "0.4.4"
vte = "0.15.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "warn"

[build-dependencies]
anyhow = "1.0.104"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
